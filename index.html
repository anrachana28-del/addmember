<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<title>Telegram Dashboard</title>
<style>
body{font-family:Arial;padding:20px;background:#f0f2f5;}
h2{color:#333;}
input,button{padding:8px;margin:5px 0;width:300px;border-radius:5px;border:1px solid #ccc;}
button{cursor:pointer;background:#4CAF50;color:white;}
button.stop{background:#f44336;}
button.restart{background:#2196F3;}
table{border-collapse:collapse;width:100%;margin-top:10px;}
th,td{border:1px solid #ccc;padding:5px;text-align:left;}
th{background:#f4f4f4;}
#bar{width:100%;background:#ddd;height:25px;border-radius:5px;margin-top:10px;}
#progress{height:25px;background:#4CAF50;width:0%;border-radius:5px;transition:width 0.3s;}
</style>
</head>
<body>

<h2>Telegram Add Members Dashboard</h2>

<form id="form">
  <input type="text" id="source" placeholder="Group ដើម (username/link)" required><br>
  <input type="text" id="target" placeholder="Group ទទួល (username/link)" required><br>
  <button type="submit">ចាប់ផ្តើម</button>
  <button type="button" class="stop" id="stopBtn">បញ្ឈប់</button>
  <button type="button" class="restart" id="restartBtn">Restart</button>
</form>

<div id="bar"><div id="progress"></div></div>

<table>
<thead>
<tr>
  <th>Member Username</th>
  <th>Status</th>
  <th>Account</th>
  <th>Source Group</th>
  <th>Target Group</th>
</tr>
</thead>
<tbody id="logTable"></tbody>
</table>

<script>
const form = document.getElementById('form');
const logTable = document.getElementById('logTable');
const progressBar = document.getElementById('progress');
const stopBtn = document.getElementById('stopBtn');
const restartBtn = document.getElementById('restartBtn');

let evt = null;

function startAdding(){
  const source = document.getElementById('source').value;
  const target = document.getElementById('target').value;
  logTable.innerHTML = '';
  progressBar.style.width = '0%';

  evt = new EventSource(`/add-members-stream?source=${encodeURIComponent(source)}&target=${encodeURIComponent(target)}`);
  evt.onmessage = e=>{
    const data = JSON.parse(e.data);
    progressBar.style.width = data.percent + '%';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${data.member||'-'}</td><td>${data.status||'-'}</td><td>${data.account||'-'}</td><td>${data.source||'-'}</td><td>${data.target||'-'}</td>`;
    logTable.appendChild(tr);
  };
  evt.onerror = ()=>{
    if(evt){ evt.close(); evt=null; }
  };
}

form.addEventListener('submit', e=>{
  e.preventDefault();
  if(evt){ evt.close(); evt=null; }
  startAdding();
});

stopBtn.addEventListener('click', ()=>{
  if(evt){ evt.close(); evt=null; fetch('/stop'); }
});

restartBtn.addEventListener('click', ()=>{
  if(evt){ evt.close(); evt=null; }
  startAdding();
});
</script>

</body>
</html>
