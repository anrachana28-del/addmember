<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Add Member</title>
<style>
body { font-family: Arial; padding:20px; background:#f6f6f6; }
h2 { color: #333; }
input, button { padding:10px; margin:5px; width:320px; font-size:16px; }
#log { margin-top:20px; white-space: pre-line; background:#eee; padding:10px; max-height:400px; overflow:auto; }
button { cursor:pointer; background:#2aabee; color:white; border:none; border-radius:5px; }
button:hover { background:#1b88c7; }
</style>
</head>
<body>
<h2>Telegram Add Member by Group Link</h2>

<input type="text" id="sourceLink" placeholder="Source Group Invite Link or Public Link"><br>
<input type="text" id="destinationLink" placeholder="MyGroup Invite Link"><br>
<input type="number" id="delay" placeholder="Delay in ms (default 5000)"><br>
<button id="start">Start Adding Members</button>

<div id="log"></div>

<script>
const startBtn = document.getElementById('start');
const logDiv = document.getElementById('log');

startBtn.addEventListener('click', async () => {
    const sourceLink = document.getElementById('sourceLink').value.trim();
    const destinationLink = document.getElementById('destinationLink').value.trim();
    const delay = Number(document.getElementById('delay').value) || 5000;

    if(!sourceLink || !destinationLink){
        alert('Please input both Source and Destination links!');
        return;
    }

    logDiv.textContent = 'Starting process...\n';

    try {
        const response = await fetch('/addMember', {
            method: 'POST',
            headers: { 'Content-Type':'application/json' },
            body: JSON.stringify({ sourceLink, destinationLink, delay })
        });

        const data = await response.json();
        if(data.success){
            logDiv.textContent += `\n✅ Done!\n${data.message}`;
        } else {
            logDiv.textContent += `\n❌ Error: ${data.message}`;
        }

    } catch(err){
        logDiv.textContent += `\n❌ Request failed: ${err.message}`;
    }
});
</script>

</body>
</html>
