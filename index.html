<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>sss</title>
<style>
body{font-family:Arial;padding:20px;background:#f4f6f9;}
button{padding:6px 12px;margin:5px;background:#4CAF50;color:#fff;border:none;border-radius:4px;cursor:pointer;}
table{border-collapse:collapse;width:100%;margin-top:10px;}
th,td{border:1px solid #ddd;padding:6px;}
th{background:#eee;}
</style>
</head>
<body>

<h2>Telegram Admin Dashboard</h2>

<h3>Accounts</h3>
<table>
<thead><tr><th>Name</th><th>Username</th><th>Status</th></tr></thead>
<tbody id="accounts"></tbody>
</table>

<h3>My Groups</h3>
<table>
<thead><tr><th>Title</th><th>ID</th><th>Username</th><th>Actions</th></tr></thead>
<tbody id="groups"></tbody>
</table>

<script>
async function loadAccounts(){
  const res=await fetch('/accounts');
  const data=await res.json();
  const tbody=document.getElementById('accounts');
  tbody.innerHTML='';
  data.forEach(a=>{
    tbody.innerHTML+=`<tr>
      <td>${a.name}</td>
      <td>${a.username}</td>
      <td>${a.status}</td>
    </tr>`;
  });
}

async function loadGroups(){
  const res=await fetch('/groups');
  const data=await res.json();
  const tbody=document.getElementById('groups');
  tbody.innerHTML='';
  data.forEach(g=>{
    tbody.innerHTML+=`<tr>
      <td>${g.title}</td>
      <td>${g.id}</td>
      <td>${g.username}</td>
      <td>
        <button onclick="generateLink('${g.id}')">Invite Link</button>
        <button onclick="exportMembers('${g.id}')">Export Members</button>
      </td>
    </tr>`;
  });
}

async function generateLink(id){
  const res=await fetch('/generate-link?groupId='+id);
  const data=await res.json();
  if(data.link) alert("Invite Link: "+data.link);
  else alert("Error: "+data.error);
}

function exportMembers(id){
  window.location='/export-members?groupId='+id;
}

loadAccounts();
loadGroups();
setInterval(()=>{loadAccounts();loadGroups();},5000);
</script>

</body>
</html>
